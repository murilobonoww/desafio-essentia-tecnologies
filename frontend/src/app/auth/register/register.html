<div class="login-container">
  <div class="login-card">
    <h1>Crie sua conta</h1>
    <p>Preencha os campos abaixo para se cadastrar</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-group">
        <label>Nome</label>
        <input formControlName="nome" type="text" placeholder="Seu nome completo" />
      </div>

      <div class="form-group">
        <label>Email</label>
        <input formControlName="email" type="email" placeholder="seu@email.com" />
      </div>

      <div class="form-group">
        <label>Senha</label>
        <input formControlName="senha" type="password" placeholder="••••••••" />
      </div>

      <div class="error" *ngIf="error()">{{ error() }}</div>

      <button type="submit" [disabled]="loading()">
        {{ loading() ? 'Cadastrando...' : 'Cadastrar' }}
      </button>
    </form>

    <p class="register-text">
      Já tem conta? <a routerLink="/login">Login</a>
    </p>
  </div>
</div>
