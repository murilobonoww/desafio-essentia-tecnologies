<div class="task_item {{ task.completed ? 'taskCompleted' : '' }}">
 <app-checkbox-splash
  [checked]="task.completed"
  (checkedChange)="toggleCompleted()"
></app-checkbox-splash>
  <span [class.completed]="task.completed">{{ task.title }}</span>
  <span class="task_description">{{ task.description }}</span>
  <span>{{task.due_date | date:'dd/MM/yyyy':'UTC'}}</span>
  <span *ngIf="task.priority" class="task_priority {{ task.priority }}">{{task.priority}}</span>
  <span *ngIf="!isCompleted" class="task_tag">pendente</span>
  <span *ngIf="isCompleted" class="task_tag taskCompleted">concluída</span>
  <button (click)="openEdit()">✏️</button>
  <button (click)="deleteTask()">🗑️</button>
</div>

<div class="editing_task_modal" *ngIf="isEditing()">
  <input type="text" [(ngModel)]="input_title_value" />
  <button (click)="editTask()">Salvar</button>
  <button (click)="cancellEditTask()">Cancelar</button>
</div>
