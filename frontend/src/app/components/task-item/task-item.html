<div class="task_item">
  <input type="checkbox" [checked]="task.completed" (change)="toggleCompleted()" />
  <span [class.completed]="task.completed">{{ task.title }}</span>
  <span>{{task.due_date | date:'dd/MM/yyyy HH:mm'}}</span>
  <button (click)="openEdit()">✏️</button>
  <button (click)="deleteTask()">🗑️</button>
</div>


<div class="editing_task_modal" *ngIf="isEditing()">
  <input type="text" [(ngModel)]="input_title_value" />
  <button (click)="editTask()">Salvar</button>
  <button (click)="cancellEditTask()">Cancelar</button>
</div>
