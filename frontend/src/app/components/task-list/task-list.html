<!-- task-list.html -->

<ng-container *ngIf="showModalCreateTask()">
</ng-container>

  <div class="task-list">
    <app-task-item *ngFor="let task of tasks(); trackBy: trackById" [task]="task">
    </app-task-item>
  </div>

  <ng-container *ngIf="tasks().length === 0">
    <p>Nenhuma tarefa ainda. Adicione uma!</p>
  </ng-container>
