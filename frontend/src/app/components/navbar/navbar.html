<nav>
    <div class="logo_navbar">
        <lucide-icon [img]="ListChecks"></lucide-icon>
    </div>

    <div>
        <h1 id="title_navbar">TaskMaster</h1>
        <p id="subtitle_navbar">Gerencie suas tarefas com maestria</p>
    </div>

    <div id="container_nav_input_buscar_tarefas">
        <lucide-icon [img]="Search" color="gray"></lucide-icon>
        <input type="text" placeholder="Buscar tarefas..." id="nav_input_buscar_tarefas" [(ngModel)]="searchTerm"
            (input)="onSearch()" />
    </div>

    <button (click)="openFilterModal()">
        <lucide-icon [img]="Funnel" color="gray"></lucide-icon>
    </button>

    <button id="btn_nav_add_new_task" (click)="openCreateTaskModal()">+ Nova tarefa</button>

    <div *ngIf="showCreateTaskModal();" class="bg_modal_create_task"></div>

    <div *ngIf="showCreateTaskModal();" class="modal_create_new_task" style="justify-content:start; padding-top: 10px;">
        <div style="display: flex; width: 100%;">
            <div
                style="display: flex; align-items: center; width: 100%; padding-left: 30px; padding-right: 20px; border-bottom: 1px solid #ccc;">
                <h1>Nova tarefa</h1>
                <button (click)="closeCreateTaskModal()"
                    style="background-color: transparent; border: none; margin-left: auto; cursor: pointer;">
                    <lucide-icon [img]="X" color="gray"></lucide-icon>
                </button>
            </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 10px; width: 90%; margin-top: 20px;">
            <label for="title">Título *</label>
            <input type="text" id="title" [(ngModel)]="newTaskTitle" placeholder="Ex: Finalizar relatório trimestral" />

            <label for="description">Descrição</label>
            <input type="text" id="description" [(ngModel)]="newTaskDescription"
                placeholder="Ex: Finalizar relatório trimestral" />

            <div style="display: flex; gap: 30px;">
                <div class="input-box">
                    <label>Data de vencimento</label>
                    <mat-form-field appearance="outline" style="width: 200px;">
                        <input matInput readonly [matDatepicker]="picker" [(ngModel)]="selectedDate">
                        <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                        <mat-datepicker #picker></mat-datepicker>
                    </mat-form-field>
                </div>
                <div style="display: flex; flex-direction: column;">

                    <p>Prioridade</p>
                    <div class="select">
                        <div class="selected" data-default="Nenhuma" data-one="Baixa" data-two="Média" data-three="Alta"
                            data-four="Urgente">
                            <svg xmlns="http://www.w3.org/2000/svg" height="1em" viewBox="0 0 512 512" class="arrow">
                                <path
                                    d="M233.4 406.6c12.5 12.5 32.8 12.5 45.3 0l192-192c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L256 338.7 86.6 169.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3l192 192z">
                                </path>
                            </svg>
                        </div>
                        <div class="options">
                            <div title="all">
                                <input id="all" name="option" type="radio" value="nenhuma" [(ngModel)]="priority"
                                    checked="" />
                                <label class="option" for="all" data-txt="Nenhuma"></label>
                            </div>
                            <div title="option-1">
                                <input id="option-1" name="option" type="radio" value="baixa" [(ngModel)]="priority" />
                                <label class="option" for="option-1" data-txt="Baixa"></label>
                            </div>
                            <div title="option-2">
                                <input id="option-2" name="option" type="radio" value="media" [(ngModel)]="priority" />
                                <label class="option" for="option-2" data-txt="Média"></label>
                            </div>
                            <div title="option-3">
                                <input id="option-3" name="option" type="radio" value="alta" [(ngModel)]="priority" />
                                <label class="option" for="option-3" data-txt="Alta"></label>
                            </div>
                            <div title="option-4">
                                <input id="option-4" name="option" type="radio" value="urgente"
                                    [(ngModel)]="priority" />
                                <label class="option" for="option-4" data-txt="Urgente"></label>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
            <div class="create_task_and_cancel_button_container" style="display: flex; gap: 10px;">
                <button (click)="closeCreateTaskModal()">Cancelar</button>
                <button (click)="CreateTask()">Criar Tarefa</button>
            </div>
        </div>
    </div>





    <!-- MODAL DE FILTROS -->

    <div *ngIf="showFilterModal();" class="bg_modal_create_task"></div>

    <div *ngIf="showFilterModal();" class="modal_create_new_task" style="justify-content:start; padding-top: 10px;">
        <div style="display: flex; width: 100%;">
            <div
                style="display: flex; align-items: center; width: 100%; padding-left: 30px; padding-right: 20px; border-bottom: 1px solid #ccc;">
                <h1>Filtros avançados</h1>
                <button (click)="closeFilterModal()"
                    style="background-color: transparent; border: none; margin-left: auto; cursor: pointer;">
                    <lucide-icon [img]="X" color="gray"></lucide-icon>
                </button>
            </div>
        </div>

        <div>
            <p>Status</p>
            <button class="status_filters {{taskService.searchStatus() === 'pendente' ? 'selected' : ''}}"
                (click)="searchByStatus('pendente')">Pendente</button>
            <button class="status_filters {{taskService.searchStatus() === 'concluida' ? 'selected' : ''}}"
                (click)="searchByStatus('concluida')">Concluída</button>
        </div>

        <button class="priority_filters" [class.selected]="taskService.searchPriority().includes('alta')"
            (click)="searchByPriority('alta')">
            Alta
        </button>

        <button class="priority_filters" [class.selected]="taskService.searchPriority().includes('baixa')"
            (click)="searchByPriority('baixa')">
            Baixa
        </button>

        <button class="priority_filters" [class.selected]="taskService.searchPriority().includes('media')"
            (click)="searchByPriority('media')">
            Média
        </button>

        <button class="priority_filters" [class.selected]="taskService.searchPriority().includes('urgente')"
            (click)="searchByPriority('urgente')">
            Urgente
        </button>



        <div class="create_task_and_cancel_button_container" style="display: flex; gap: 10px;">
            <button (click)="closeFilterModal()">Cancelar</button>
            <button (click)="CreateTask()">Criar Tarefa</button>
        </div>
    </div>
</nav>
